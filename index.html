<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141d">
    <meta
      name="description"
      content="Download Chess, a chess game for Windows."
    >
    <title>Chess — Download</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111318;
        color: #f4f4f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: radial-gradient(ellipse at 50% 42%, #20232a 0, #111318 68%);
      }

      main {
        width: min(100%, 360px);
        padding: 28px;
        border: 1px solid #30333a;
        border-radius: 18px;
        background: rgb(25 27 32 / 94%);
        box-shadow: 0 20px 60px rgb(0 0 0 / 28%);
        text-align: center;
      }

      .mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
        border: 1px solid #444038;
        border-radius: 15px;
        background: #29271f;
        color: #e8cf8f;
        font-family: Georgia, serif;
        font-size: 30px;
        line-height: 1;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: #c6ad70;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.035em;
      }

      .intro {
        margin: 8px 0 20px;
        color: #a4a6ad;
        font-size: 14px;
        line-height: 1.5;
      }

      .download {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: #e8cf8f;
        color: #1b1a17;
        font-size: 14px;
        font-weight: 750;
        text-decoration: none;
        transition: transform 160ms ease, background-color 160ms ease;
      }

      .download:hover {
        transform: translateY(-2px);
        background: #f1dda8;
      }

      .download:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      .download svg {
        width: 17px;
        height: 17px;
      }

      .details {
        margin: 12px 0 0;
        color: #858790;
        font-size: 11px;
      }

      @media (max-height: 420px) {
        main {
          padding: 12px;
        }

        .mark,
        .eyebrow {
          display: none;
        }

        h1 {
          font-size: 29px;
        }

        .intro {
          margin: 6px 0 12px;
        }

        .download {
          min-height: 44px;
        }

        .details {
          margin-top: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">♞</div>
      <p class="eyebrow">A game of strategy</p>
      <h1>Chess</h1>
      <p class="intro">
        Ready to make your move? Download the game and start playing.
      </p>
      <a class="download" href="Chess.exe" download="Chess.exe">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Download for Windows
      </a>
      <p class="details">Windows · Chess.exe</p>
    </main>
  </body>
</html>
